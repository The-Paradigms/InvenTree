# Docker Compose configuration for production self-hosting of InvenTree
# Documentation: https://docs.inventree.org/en/latest/start/docker/
#
# Quickstart:
#   1. cp .env.example .env && edit .env
#   2. ./docker-host.sh start   (or: docker compose up -d)

services:
    # -------------------------------------------------------------------------
    # PostgreSQL Database Backend
    # -------------------------------------------------------------------------
    inventree-db:
        image: postgres:17
        container_name: inventree-db
        restart: unless-stopped
        expose:
            - ${INVENTREE_DB_PORT:-5432}/tcp
        environment:
            - PGDATA=/var/lib/postgresql/data/pgdb
            - POSTGRES_USER=${INVENTREE_DB_USER:-pguser}
            - POSTGRES_PASSWORD=${INVENTREE_DB_PASSWORD:-pgpassword}
            - POSTGRES_DB=${INVENTREE_DB_NAME:-inventree}
        volumes:
            - ${INVENTREE_EXT_VOLUME:-./inventree-data}:/var/lib/postgresql/data/:z
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${INVENTREE_DB_USER:-pguser} -d ${INVENTREE_DB_NAME:-inventree}"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s

    # -------------------------------------------------------------------------
    # Redis Cache and Task Broker
    # -------------------------------------------------------------------------
    inventree-cache:
        image: redis:7-alpine
        container_name: inventree-cache
        restart: always
        env_file:
            - path: .env
              required: false
        expose:
            - ${INVENTREE_CACHE_PORT:-6379}
        volumes:
            - ${INVENTREE_EXT_VOLUME:-./inventree-data}/redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    # -------------------------------------------------------------------------
    # InvenTree Application Server (Gunicorn)
    # -------------------------------------------------------------------------
    inventree-server:
        image: ${INVENTREE_IMAGE:-inventree/inventree}:${INVENTREE_TAG:-stable}
        container_name: inventree-server
        restart: unless-stopped
        expose:
            - ${INVENTREE_WEB_PORT:-8000}
        depends_on:
            inventree-db:
                condition: service_healthy
            inventree-cache:
                condition: service_healthy
        env_file:
            - path: .env
              required: false
        environment:
            - INVENTREE_SERVER=http://inventree-server:${INVENTREE_WEB_PORT:-8000}
        volumes:
            - ${INVENTREE_EXT_VOLUME:-./inventree-data}:/home/inventree/data:z

    # -------------------------------------------------------------------------
    # InvenTree Background Worker (django-q / invoke worker)
    # -------------------------------------------------------------------------
    inventree-worker:
        image: ${INVENTREE_IMAGE:-inventree/inventree}:${INVENTREE_TAG:-stable}
        container_name: inventree-worker
        restart: unless-stopped
        command: invoke worker
        depends_on:
            inventree-server:
                condition: service_started
        env_file:
            - path: .env
              required: false
        volumes:
            - ${INVENTREE_EXT_VOLUME:-./inventree-data}:/home/inventree/data:z

    # -------------------------------------------------------------------------
    # Caddy Reverse Proxy & Static/Media File Server
    # -------------------------------------------------------------------------
    inventree-proxy:
        image: caddy:alpine
        container_name: inventree-proxy
        restart: always
        depends_on:
            - inventree-server
        ports:
            - ${INVENTREE_HTTP_PORT:-80}:80
            - ${INVENTREE_HTTPS_PORT:-443}:443
        env_file:
            - path: .env
              required: false
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
            - ${INVENTREE_EXT_VOLUME:-./inventree-data}/static:/var/www/static:z
            - ${INVENTREE_EXT_VOLUME:-./inventree-data}/media:/var/www/media:z
            - ${INVENTREE_EXT_VOLUME:-./inventree-data}/caddy-log:/var/log/caddy:z
            - ${INVENTREE_EXT_VOLUME:-./inventree-data}/caddy-data:/data:z
            - ${INVENTREE_EXT_VOLUME:-./inventree-data}/caddy-config:/config:z
